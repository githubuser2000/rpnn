[package]
name = "retaprompt_frontends"
version = "0.1.0"
edition = "2024"
autobins = false
description = "Additive dedicated frontend package for rp/rpl/rpb/rpe that depends on the shared retaprompt staticlib package."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
retaprompt_input = { path = "../retaprompt_input" }
retaprompt_commands = { path = "../retaprompt_commands" }

[[bin]]
name = "rp"
path = "src/bin/rp.rs"

[[bin]]
name = "rpl"
path = "src/bin/rpl.rs"

[[bin]]
name = "rpb"
path = "src/bin/rpb.rs"

[[bin]]
name = "rpe"
path = "src/bin/rpe.rs"
