[package]
name = "retaprompt_frontends"
version = "0.7.0"
edition = "2024"
autobins = false
publish = false

# The public rrp/rrpl/rrpe/rrpb Cargo targets are thin ABI launchers only.
# They must never call retaprompt_input:: or retaprompt_commands:: Rust APIs
# directly, because that embeds the heavy prompt code into the executable.
# Optional dependencies below are only for the diagnostic architecture inspect
# binary, not for the public launchers.
[dependencies]
libloading = "0.8"
retaprompt_input = { path = "../retaprompt_input", optional = true }
retaprompt_commands = { path = "../retaprompt_commands", optional = true }
serde_json = { version = "1", optional = true }

[features]
default = []
# Compatibility feature name retained, but it no longer means "embed prompt
# Rust code in rrp/rrpl/rrpe/rrpb". Public prompt binaries stay ABI launchers.
rust-frontends = []
arch-inspect = ["dep:retaprompt_input", "dep:retaprompt_commands", "dep:serde_json"]

[[bin]]
name = "rrp"
path = "src/bin/rp.rs"

[[bin]]
name = "rrpl"
path = "src/bin/rpl.rs"

[[bin]]
name = "rrpb"
path = "src/bin/rpb.rs"

[[bin]]
name = "rrpe"
path = "src/bin/rpe.rs"

[[bin]]
name = "rretaprompt_arch_inspect"
path = "src/bin/retaprompt_arch_inspect.rs"
required-features = ["arch-inspect"]
