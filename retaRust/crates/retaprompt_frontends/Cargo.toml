[package]
name = "retaprompt_frontends"
version = "0.1.0"
edition = "2024"
autobins = false
description = "Dedicated frontend package for a single retaPrompt launcher binary on top of the split input and command libraries."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
retaprompt_input = { path = "../retaprompt_input" }
retaprompt_commands = { path = "../retaprompt_commands" }

[[bin]]
name = "retaprompt_launcher"
path = "src/bin/retaprompt_launcher.rs"
