[package]
name = "retaprompt_frontends"
version = "0.7.0"
edition = "2024"
autobins = false
publish = false

[dependencies]
retaprompt_input = { path = "../retaprompt_input" }
retaprompt_commands = { path = "../retaprompt_commands" }
serde_json = "1"

[features]
# Kept for compatibility with older scripts. Public rrp/rrpl/rrpe/rrpb Cargo bins
# are no longer gated, so `cargo run --bin rrp -- -h` works without features.
rust-frontends = []

#[[bin]]
#name = "retaprompt_launcher"
#path = "src/bin/retaprompt_launcher.rs"

[[bin]]
name = "rrp"
path = "src/bin/rp.rs"

[[bin]]
name = "rrpl"
path = "src/bin/rpl.rs"

[[bin]]
name = "rrpb"
path = "src/bin/rpb.rs"

[[bin]]
name = "rrpe"
path = "src/bin/rpe.rs"

[[bin]]
name = "rretaprompt_arch_inspect"
path = "src/bin/retaprompt_arch_inspect.rs"
