[package]
name = "retaprompt"
version = "0.1.0"
edition = "2024"
autobins = false
description = "Additive static library and binary frontend package for retaPrompt (rp/rpl/rpb/rpe)."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "retaprompt"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[dependencies]
reta = { path = "../.." }

