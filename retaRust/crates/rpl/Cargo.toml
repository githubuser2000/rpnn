[package]
name = "rpl"
version = "0.1.0"
edition = "2024"
autobins = false
description = "Dedicated static library for retaPrompt rpl frontend."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "rpl"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[dependencies]
retaprompt = { path = "../retaprompt" }
