[package]
name = "retaprompt_commands"
version = "0.1.0"
edition = "2024"
autobins = false
description = "Prompt command library layer for rp/rpl/rpe/rpb on top of reta."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "retaprompt_commands"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
indexmap = { version = "2", features = ["serde"] }
libloading = "0.8"
reedline = "0.47.0"
ratatui = { version = "0.30.0", features = ["crossterm"] }
crossterm = "0.29.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
