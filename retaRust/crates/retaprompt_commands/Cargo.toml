[package]
name = "retaprompt_commands"
version = "0.7.0"
edition = "2024"
autobins = false
publish = false

[lib]
name = "retaprompt_commands"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
reta_architecture = { path = "../reta_architecture" }
indexmap = { version = "2", features = ["serde"] }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
