[package]
name = "retaprompt_input"
version = "0.1.0"
edition = "2024"
autobins = false
description = "Own command input library layer for rp/rpl/rpe on top of reta."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "retaprompt_input"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
reta = { path = "../.." }
retaprompt_commands = { path = "../retaprompt_commands" }
