[package]
name = "reta"
version = "0.6.0"
edition = "2024"
autobins = false
default-run = "rreta"

[dependencies]
reta_architecture = { path = "crates/reta_architecture" }
indexmap = { version = "2", features = ["serde"] }
hypher = { version = "0.1.7", default-features = false, features = ["german"] }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "reta"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "rreta"
path = "src/bin/reta.rs"

[[bin]]
name = "rgrundStrukHtml"
path = "src/bin/grundStrukHtml.rs"

[[bin]]
name = "rreta_arch_inspect"
path = "src/bin/reta_arch_inspect.rs"

[[bin]]
name = "rreta_arch_materialize"
path = "src/bin/reta_arch_materialize.rs"

[[bin]]
name = "rreta_arch_html_classes"
path = "src/bin/reta_arch_html_classes.rs"

[[bin]]
name = "rreta_arch_view"
path = "src/bin/reta_arch_view.rs"

[[bin]]
name = "rreta_arch_view_output"
path = "src/bin/reta_arch_view_output.rs"

[[bin]]
name = "rreta_arch_view_output_shadow"
path = "src/bin/reta_arch_view_output_shadow.rs"

[[bin]]
name = "rgenerate4readme"
path = "src/bin/generate4readme.rs"

#[[bin]]
#name = r"reta_domain_probe"
#path = "src/bin/reta_domain_probe.rs"

#[[bin]]
#name = "reta_extract_html_classes"
#path = "src/bin/reta_extract_html_classes.rs"


[workspace]
members = [
  ".",
  "crates/reta_architecture",
  "crates/retaprompt_input",
  "crates/retaprompt_commands",
  "crates/retaprompt_frontends"
]
default-members = [
  ".",
  "crates/reta_architecture",
  "crates/retaprompt_input",
  "crates/retaprompt_commands",
  "crates/retaprompt_frontends"
]
resolver = "2"


[[bin]]
name = "rreta_arch_view_output_parity"
path = "src/bin/reta_arch_view_output_parity.rs"
