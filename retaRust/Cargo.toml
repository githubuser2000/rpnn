[package]
name = "reta"
version = "0.7.0"
edition = "2024"
autobins = false
default-run = "rreta"

[features]
default = []
split-facade = []
# Public cargo-run launchers rreta and rgrundStrukHtml are always visible.
# This feature gates only the heavier diagnostic/tool binaries.
rust-tool-bins = []

[dependencies]
reta_architecture = { path = "crates/reta_architecture" }
indexmap = { version = "2", features = ["serde"] }
hypher = { version = "0.1.7", default-features = false, features = ["german"] }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "reta"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "rreta"
path = "src/bin/reta.rs"

[[bin]]
name = "rgrundStrukHtml"
path = "src/bin/grundStrukHtml.rs"

[[bin]]
name = "rreta_arch_inspect"
path = "src/bin/reta_arch_inspect.rs"
required-features = ["rust-tool-bins"]

[[bin]]
name = "rreta_arch_materialize"
