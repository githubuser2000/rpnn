[package]
name = "reta"
version = "0.1.0"
edition = "2024"
default-run = "reta"

[dependencies]
indexmap = "2"
hypher = { version = "0.1.7", default-features = false, features = ["german"] }
termimad = "0.34.1"

[lib]
name = "reta"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "reta"
path = "src/bin/reta.rs"

[[bin]]
name = "grundStrukHtml"
path = "src/bin/grundStrukHtml.rs"

[[bin]]
name = "generate4readme"
path = "src/bin/generate4readme.rs"

[[bin]]
name = "reta_min"
path = "src/bin/reta_min.rs"

[[bin]]
name = "reta_domain_probe"
path = "src/bin/reta_domain_probe.rs"
